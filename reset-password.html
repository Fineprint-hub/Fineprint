<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password — Fineprint</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%236366f1'/%3E%3Ccircle cx='42' cy='42' r='18' fill='none' stroke='white' stroke-width='8'/%3E%3Cline x1='55' y1='55' x2='75' y2='75' stroke='white' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a1628;
  color: #f0f6ff;
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

body::before {
  content: '';
  position: fixed;
  top: -200px; left: 50%;
  transform: translateX(-50%);
  width: 600px; height: 500px;
  background: radial-gradient(ellipse, rgba(41,121,212,0.1) 0%, transparent 70%);
  pointer-events: none;
}

nav {
  padding: 0 32px;
  height: 64px;
  display: flex;
  align-items: center;
  background: rgba(10,22,40,0.95);
  border-bottom: 1px solid rgba(79,172,254,0.1);
}

.nav-logo {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none;
}

.nav-logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, #2979d4, #4facfe);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}

.nav-logo-text {
  font-family: 'Playfair Display', serif;
  font-size: 19px; font-weight: 700;
  color: #f0f6ff;
}

.page {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}

.card {
  background: rgba(17,34,64,0.6);
  border: 1px solid rgba(79,172,254,0.12);
  border-radius: 20px;
  padding: 40px 36px;
  width: 100%;
  max-width: 420px;
}

.card-icon {
  width: 52px; height: 52px;
  background: linear-gradient(135deg, rgba(41,121,212,0.2), rgba(79,172,254,0.1));
  border: 1px solid rgba(79,172,254,0.2);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  margin-bottom: 20px;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 26px; font-weight: 700;
  margin-bottom: 8px;
}

.subtitle {
  font-size: 14px; color: #8b9dbb;
  margin-bottom: 28px; line-height: 1.6;
}

.form-group { margin-bottom: 16px; }

.form-label {
  display: block;
  font-size: 12px; font-weight: 600;
  color: #8b9dbb;
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 8px;
}

.input-wrapper { position: relative; }

.form-input {
  width: 100%;
  background: rgba(10,22,40,0.6);
  border: 1px solid rgba(79,172,254,0.15);
  border-radius: 10px;
  padding: 13px 44px 13px 16px;
  color: #f0f6ff;
  font-size: 14px; font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}

.form-input:focus { border-color: rgba(79,172,254,0.4); }
.form-input::placeholder { color: rgba(139,157,187,0.35); }

.toggle-pw {
  position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%);
  background: transparent; border: none;
  color: #8b9dbb; cursor: pointer; font-size: 16px; padding: 0;
}

/* Password strength bars */
.strength-bars {
  display: flex; gap: 4px; margin-top: 8px;
}

.strength-bar {
  flex: 1; height: 3px; border-radius: 2px;
  background: rgba(79,172,254,0.1);
  transition: background 0.3s;
}

.strength-bar.weak { background: #e05a5a; }
.strength-bar.medium { background: #e8a838; }
.strength-bar.strong { background: #3db88a; }

.alert {
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}

.alert.show { display: block; }
.alert.success { background: rgba(61,184,138,0.1); border: 1px solid rgba(61,184,138,0.3); color: #90e0bb; }
.alert.error { background: rgba(224,90,90,0.1); border: 1px solid rgba(224,90,90,0.3); color: #f0b0b0; }

.submit-btn {
  width: 100%;
  margin-top: 8px;
  padding: 14px;
  border-radius: 10px; border: none;
  background: linear-gradient(135deg, #2979d4, #4facfe);
  color: #fff;
  font-size: 15px; font-weight: 600; font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 20px rgba(41,121,212,0.3);
}

.submit-btn:hover { transform: translateY(-1px); }
.submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  display: none;
}

@keyframes spin { to { transform: rotate(360deg); } }

.invalid-link {
  text-align: center; padding: 20px 0;
}

.invalid-link .big-icon { font-size: 40px; margin-bottom: 16px; }
.invalid-link h2 { font-size: 20px; margin-bottom: 8px; }
.invalid-link p { font-size: 14px; color: #8b9dbb; margin-bottom: 20px; }

.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: #4facfe; font-size: 14px; text-decoration: none;
  margin-top: 20px;
  transition: opacity 0.2s;
}

.back-link:hover { opacity: 0.8; }

@media (max-width: 480px) {
  .card { padding: 28px 20px; }
  h1 { font-size: 22px; }
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/">
    <div class="nav-logo-icon">🔍</div>
    <span class="nav-logo-text">Fineprint</span>
  </a>
</nav>

<div class="page">
  <div class="card">

    <!-- Valid reset form -->
    <div id="reset-form">
      <div class="card-icon">🔒</div>
      <h1>Set new password</h1>
      <p class="subtitle">Choose a strong password for your Fineprint account.</p>

      <div id="alert-success" class="alert success"></div>
      <div id="alert-error" class="alert error"></div>

      <div class="form-group">
        <label class="form-label">New Password</label>
        <div class="input-wrapper">
          <input type="password" class="form-input" id="new-password"
            placeholder="At least 8 characters"
            oninput="checkStrength()"/>
          <button class="toggle-pw" onclick="togglePw('new-password', this)" type="button">👁</button>
        </div>
        <div class="strength-bars">
          <div class="strength-bar" id="bar1"></div>
          <div class="strength-bar" id="bar2"></div>
          <div class="strength-bar" id="bar3"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <div class="input-wrapper">
          <input type="password" class="form-input" id="confirm-password"
            placeholder="Repeat new password"/>
          <button class="toggle-pw" onclick="togglePw('confirm-password', this)" type="button">👁</button>
        </div>
      </div>

      <button class="submit-btn" id="submit-btn" onclick="resetPassword()">
        <div class="spinner" id="spinner"></div>
        <span id="btn-text">Update Password →</span>
      </button>

      <a href="/fineprint-auth.html" class="back-link">← Back to Sign In</a>
    </div>

    <!-- Invalid/expired link -->
    <div id="invalid-link" style="display:none;">
      <div class="invalid-link">
        <div class="big-icon">⚠️</div>
        <h2>Link expired</h2>
        <p>This password reset link has expired or already been used. Request a new one from the sign in page.</p>
        <a href="/fineprint-auth.html" class="submit-btn" style="text-decoration:none;display:inline-flex;">
          Back to Sign In →
        </a>
      </div>
    </div>

  </div>
</div>

<script>
var SUPABASE_URL = 'https://rguczlvardgbjsamutrm.supabase.co'
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJndWN6bHZhcmRnYmpzYW11dHJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1ODM3NDYsImV4cCI6MjA5NTE1OTc0Nn0.9Av83cEUriFk6yR9HPHZzwclTr_GVdnr0a4MQTMHDks'
var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

// Check for valid session from reset link
window.addEventListener('load', async function() {
  const { data: { session } } = await supabase.auth.getSession()
  if (!session) {
    document.getElementById('reset-form').style.display = 'none'
    document.getElementById('invalid-link').style.display = 'block'
  }
})

async function resetPassword() {
  const newPw = document.getElementById('new-password').value
  const confirmPw = document.getElementById('confirm-password').value

  clearAlerts()

  if (newPw.length < 8) { showAlert('error', 'Password must be at least 8 characters.'); return }
  if (newPw !== confirmPw) { showAlert('error', 'Passwords do not match.'); return }

  setLoading(true)

  const { error } = await supabase.auth.updateUser({ password: newPw })
  setLoading(false)

  if (error) {
    showAlert('error', error.message)
  } else {
    showAlert('success', '✓ Password updated! Redirecting you to sign in...')
    setTimeout(() => { window.location.href = '/dashboard.html' }, 2000)
  }
}

function checkStrength() {
  const pw = document.getElementById('new-password').value
  const bars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3')]
  bars.forEach(b => b.className = 'strength-bar')

  if (pw.length === 0) return
  if (pw.length < 6) {
    bars[0].classList.add('weak')
  } else if (pw.length < 10) {
    bars[0].classList.add('medium')
    bars[1].classList.add('medium')
  } else {
    bars.forEach(b => b.classList.add('strong'))
  }
}

function togglePw(id, btn) {
  const input = document.getElementById(id)
  input.type = input.type === 'password' ? 'text' : 'password'
  btn.textContent = input.type === 'password' ? '👁' : '🙈'
}

function setLoading(loading) {
  document.getElementById('submit-btn').disabled = loading
  document.getElementById('spinner').style.display = loading ? 'inline-block' : 'none'
  document.getElementById('btn-text').style.opacity = loading ? '0' : '1'
}

function showAlert(type, msg) {
  const el = document.getElementById('alert-' + type)
  el.textContent = msg
  el.classList.add('show')
}

function clearAlerts() {
  ['success','error'].forEach(t => document.getElementById('alert-' + t).classList.remove('show'))
}
</script>
</body>
</html>
